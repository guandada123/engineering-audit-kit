# Pre-commit hooks — Engineering Audit Kit
# Install: pip install pre-commit && pre-commit install
# Run: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Python: ruff (lint + format)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Secret 扫描
  - repo: local
    hooks:
      - id: gitleaks
        name: Gitleaks (secret scan)
        entry: gitleaks git --pre-commit --verbose --redact
        language: system
        stages: [pre-commit]
        always_run: true
        # 必须关掉：pre-commit 默认会把变更文件名追加到 entry 后面，而 gitleaks git 只接
        # 1 个位置参数（仓库路径），多传即 FTL "accepts at most 1 arg(s), received 2"，
        # 导致任何有文件变更的提交都直接被钩子拦死（2026-11-01 实测，gitleaks 8.30.1）。
        # 该钩子靠 --pre-commit 自己扫暂存区，不需要文件列表。
        pass_filenames: false
